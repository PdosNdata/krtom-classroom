<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>เกมพลิกไพ่จับคู่สัญลักษณ์ผังงาน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');
*{box-sizing:border-box} body{margin:0;font-family:'Sarabun','TH Sarabun New',sans-serif;background:linear-gradient(135deg,#dff7ff,#fff5d9,#f4e8ff);color:#172554;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:20px}.hero{background:linear-gradient(90deg,#27b7ff,#7057ff);color:white;border-radius:28px;padding:20px;text-align:center;box-shadow:0 12px 30px #6b7cff33;border:4px solid #fff}.hero h1{font-size:clamp(28px,5vw,48px);margin:0}.hero p{font-size:20px;margin:5px}.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:18px;padding:12px 20px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 #0002}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}.primary{background:#ffcf33;color:#533900}.secondary{background:#fff;color:#3949ab}.stage{font-size:24px;font-weight:700;text-align:center}.stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px}.pill{background:white;padding:8px 16px;border-radius:999px;box-shadow:0 3px 12px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}.card{height:170px;perspective:1100px;cursor:pointer;filter:drop-shadow(0 10px 7px #26356a35)}.inner{position:relative;width:100%;height:100%;transition:.5s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d}.card:hover .inner{transform:translateY(-5px) rotateX(2deg)}.card.flip .inner,.card.matched .inner{transform:rotateY(180deg) translateY(-3px)}.face{position:absolute;inset:0;border-radius:27px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;border:5px solid #fff;box-shadow:inset 0 3px 2px #ffffffcc,inset 0 -8px 12px #17255422,0 7px 0 #23387655,0 13px 22px #2338762b;overflow:hidden}.face:before{content:'';position:absolute;left:9px;right:9px;top:8px;height:34%;border-radius:20px;background:linear-gradient(180deg,#ffffff99,#ffffff08);pointer-events:none}.front{background:linear-gradient(145deg,#22b9ff 0%,#3478f6 45%,#7048e8 100%);color:white;font-size:54px;font-weight:700;text-shadow:0 3px 0 #20319a;box-shadow:inset 0 3px 3px #ffffffbb,inset 0 -12px 15px #30168d55,0 7px 0 #2733a5,0 13px 22px #23387635}.front:after{content:'✦';position:absolute;right:17px;top:14px;font-size:25px;color:#ffe66d;text-shadow:none}.back{background:linear-gradient(145deg,#ffffff,#eef8ff 55%,#e6e0ff);transform:rotateY(180deg);font-size:19px;font-weight:700;color:#172554}.back:after{content:'';position:absolute;inset:9px;border:2px dashed #5b7cff66;border-radius:19px;pointer-events:none}.back>*{position:relative;z-index:2}.matched .back{outline:5px solid #50d46a;background:linear-gradient(145deg,#f7fff8,#dfffe7);box-shadow:inset 0 3px 3px #fff,inset 0 -10px 16px #45b95b2b,0 7px 0 #27a445,0 13px 22px #1c8f3430}.shape{width:108px;height:65px;margin:auto;background:linear-gradient(145deg,#a7ddff,#58aaf6);border:4px solid #1463cf;box-shadow:inset 0 4px 5px #fff9,inset 0 -7px 8px #155fc044,0 7px 0 #0c4ea8,0 10px 13px #173a6b35}.term{color:#4c1d95}.small{font-size:16px;line-height:1.35}.oval{border-radius:50px;background:linear-gradient(145deg,#ffb8dc,#ff63ad);border-color:#d82078}.io{transform:skew(-20deg);background:linear-gradient(145deg,#d9b7ff,#9a5ce8);border-color:#6731b8}.diamond{width:78px;height:78px;transform:rotate(45deg);background:linear-gradient(145deg,#9cff82,#42cf4c);border-color:#128c28}.diamond span{display:block;transform:rotate(-45deg)}.arrow{width:110px;height:5px;background:#111;border:0;position:relative}.arrow:after{content:'';position:absolute;right:-2px;top:-8px;border-left:18px solid #111;border-top:10px solid transparent;border-bottom:10px solid transparent}.circle{width:68px;height:68px;border-radius:50%;background:linear-gradient(145deg,#ffe071,#ff9d18);border-color:#d65b00}.off{width:65px;height:75px;background:linear-gradient(145deg,#79c5ff,#367fe9);border-color:#1457bf;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%)}.pre{background:linear-gradient(145deg,#debfff,#a66ce9);border-color:#6932bf;position:relative}.pre:before,.pre:after{content:'';position:absolute;top:0;bottom:0;width:4px;background:#6932bf}.pre:before{left:15px}.pre:after{right:15px}.doc{height:70px;background:linear-gradient(145deg,#ffd0e5,#ff83bd);border-color:#e12675;clip-path:polygon(0 0,100% 0,100% 80%,75% 70%,50% 85%,25% 100%,0 90%)}.overlay{position:fixed;inset:0;background:#15213dcc;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal{background:white;border-radius:28px;padding:28px;max-width:520px;text-align:center}.modal h2{font-size:34px;margin:0 0 8px;color:#4f46e5}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}.card{height:135px}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.card{height:125px}.back{font-size:16px}}
</style></head>
<body><div class="wrap">
<div class="hero"><h1>🧩 เกมพลิกไพ่จับคู่สัญลักษณ์ผังงาน</h1><p>เรียนรู้ Flowchart สนุก ๆ ผ่านการจับคู่</p></div>
<div class="toolbar"><button class="btn primary" onclick="setStage(1)">ด่าน 1 ชื่อ ↔ สัญลักษณ์</button><button class="btn primary" onclick="setStage(2)">ด่าน 2 ชื่อ ↔ ความหมาย</button><button class="btn secondary" onclick="newGame()">🔄 เริ่มใหม่</button></div>
<div class="stage" id="stage"></div><div class="stats"><div class="pill">⭐ คะแนน <b id="score">0</b></div><div class="pill">🎯 จับคู่แล้ว <b id="pairs">0</b>/9</div><div class="pill">👆 ครั้งที่พลิก <b id="moves">0</b></div></div>
<div class="grid" id="grid"></div></div>
<div class="overlay" id="overlay"><div class="modal"><h2>🎉 ผ่านด่านแล้ว!</h2><p id="result"></p><button class="btn primary" id="nextBtn">ไปต่อ</button></div></div>
<script>
const items=[
{id:'term',name:'จุดเริ่มต้น/จุดสิ้นสุด (Terminator)',meaning:'ใช้แสดงจุดเริ่มต้นหรือจุดสิ้นสุดของผังงาน',shape:'<div class="shape oval"></div>'},
{id:'process',name:'การประมวลผล (Process)',meaning:'ใช้แสดงการทำงานหรือการประมวลผล',shape:'<div class="shape"></div>'},
{id:'io',name:'รับข้อมูล/แสดงผล (Input/Output)',meaning:'ใช้แสดงการรับข้อมูลเข้าหรือการแสดงผลลัพธ์',shape:'<div class="shape io"></div>'},
{id:'decision',name:'การตัดสินใจ (Decision)',meaning:'ใช้แสดงการตรวจสอบเงื่อนไข เพื่อเลือกเส้นทางการทำงาน',shape:'<div class="shape diamond"><span></span></div>'},
{id:'flow',name:'เส้นทางการไหล (Flowline)',meaning:'ใช้แสดงทิศทางการไหลของขั้นตอนการทำงาน',shape:'<div class="arrow"></div>'},
{id:'connector',name:'จุดเชื่อมต่อ (Connector)',meaning:'ใช้เชื่อมต่อเส้นทางการไหลภายในหน้ากระดาษเดียวกัน',shape:'<div class="shape circle"></div>'},
{id:'off',name:'จุดเชื่อมต่อไปหน้าถัดไป (Off-page Connector)',meaning:'ใช้เชื่อมต่อเส้นทางการไหลไปยังหน้ากระดาษอื่น',shape:'<div class="shape off"></div>'},
{id:'pre',name:'กระบวนการย่อย (Predefined Process)',meaning:'ใช้แสดงการทำงานที่กำหนดไว้แล้ว เช่น โปรแกรมย่อย',shape:'<div class="shape pre"></div>'},
{id:'doc',name:'เอกสาร (Document)',meaning:'ใช้แสดงข้อมูลในรูปแบบเอกสาร เช่น รายงาน',shape:'<div class="shape doc"></div>'}
];
let stage=1,first=null,lock=false,matched=0,moves=0,score=0;
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function setStage(n){stage=n;newGame()}
function newGame(){first=null;lock=false;matched=moves=score=0;document.getElementById('overlay').style.display='none';update();document.getElementById('stage').textContent=stage===1?'ด่าน 1 : จับคู่ “ชื่อสัญลักษณ์” กับ “รูปสัญลักษณ์”':'ด่าน 2 : จับคู่ “ชื่อสัญลักษณ์” กับ “ความหมาย”';let cards=[];items.forEach(x=>{cards.push({key:x.id,type:'name',html:'<div class="term">'+x.name+'</div>'});cards.push({key:x.id,type:stage===1?'shape':'meaning',html:stage===1?x.shape:'<div class="small">'+x.meaning+'</div>'})});cards=shuffle(cards);let g=document.getElementById('grid');g.innerHTML='';cards.forEach((c,i)=>{let d=document.createElement('div');d.className='card';d.dataset.key=c.key;d.dataset.type=c.type;d.innerHTML='<div class="inner"><div class="face front">?</div><div class="face back">'+c.html+'</div></div>';d.onclick=()=>flip(d);g.appendChild(d)})}
function flip(c){if(lock||c.classList.contains('flip')||c.classList.contains('matched'))return;c.classList.add('flip');if(!first){first=c;return}moves++;if(first.dataset.key===c.dataset.key&&first.dataset.type!==c.dataset.type){first.classList.add('matched');c.classList.add('matched');first.classList.remove('flip');c.classList.remove('flip');matched++;score+=10;first=null;update();if(matched===items.length)setTimeout(done,450)}else{lock=true;score=Math.max(0,score-1);update();let a=first;first=null;setTimeout(()=>{a.classList.remove('flip');c.classList.remove('flip');lock=false},800)}}
function update(){scoreEl=document.getElementById('score');scoreEl.textContent=score;document.getElementById('pairs').textContent=matched;document.getElementById('moves').textContent=moves}
function done(){document.getElementById('result').innerHTML='คุณจับคู่ครบทั้ง 9 คู่แล้ว<br>คะแนน <b>'+score+'</b> คะแนน • พลิก '+moves+' ครั้ง';let b=document.getElementById('nextBtn');b.textContent=stage===1?'ไปด่าน 2 ➜':'เล่นอีกครั้ง';b.onclick=()=>{if(stage===1)setStage(2);else newGame()};document.getElementById('overlay').style.display='flex'}
newGame();
</script></body></html>
