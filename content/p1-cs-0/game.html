<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมพลิกไพ่ความจำ: อุปกรณ์เทคโนโลยี — ป.1 หน่วย 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tts.css">
<style>
  :root{ font-family:"Sarabun","TH Sarabun New",system-ui,sans-serif; font-size:36px; } /* ป.1-3: เนื้อหา 36px */
  html,body{ margin:0; padding:0; background:#F7F8FC; color:#1F2430; }
  header{
    background:linear-gradient(135deg,#EC4899,#F97316);
    color:#fff; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{ margin:0; font-size:42px; }
  #finish h2{ margin:8px 0; font-size:42px; }
  header a{ color:#fff; background:rgba(255,255,255,.22); padding:8px 16px; border-radius:999px; font-size:.82rem; text-decoration:none; }

  p.desc{ max-width:600px; margin:14px auto 0; padding:0 20px; font-size:.9rem; color:#555; text-align:center; }

  #hud{ max-width:500px; margin:14px auto 0; padding:0 20px; display:flex; justify-content:center; gap:10px; }
  #hud .pill{ background:#fff; border:1px solid #E6E8F0; border-radius:999px; padding:7px 16px; font-weight:700; font-size:.88rem; box-shadow:0 4px 10px rgba(0,0,0,.06); }

  #board{
    max-width:460px; margin:20px auto 40px; padding:0 20px;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;
  }
  @media (max-width:360px){ #board{ grid-template-columns:repeat(2, 1fr); } }

  .card{
    aspect-ratio:3/4; border-radius:12px; cursor:pointer; position:relative;
    perspective:600px;
  }
  .card-inner{
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transition:transform .4s;
  }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .card-face{
    position:absolute; inset:0; border-radius:12px; display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; box-shadow:0 3px 8px rgba(0,0,0,.12);
  }
  .card-back{ background:linear-gradient(135deg,#8B5CF6,#3B82F6); font-size:1.6rem; }
  .card-front{
    background:#fff; transform:rotateY(180deg); padding:6px; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  .card-front svg{ width:70%; height:60%; }
  .card-front span{ font-size:.68rem; font-weight:700; }
  .card.matched .card-front{ background:#F0FBF6; border:2px solid #10B981; }

  #finish{
    position:fixed; inset:0; background:rgba(20,10,30,.55); z-index:40;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  #finish .card2{ background:#fff; border-radius:22px; padding:32px 24px; text-align:center; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  #finish button{ margin-top:14px; padding:11px 26px; border:none; border-radius:999px; background:#10B981; color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>🎮 เกมพลิกไพ่ความจำ: อุปกรณ์เทคโนโลยี</h1>
  <a href="../../index.html#/unit/p1/cs/0/game">← กลับหน้าหน่วย</a>
</header>

<p class="desc" id="game-desc">หน่วยที่ 1 การใช้งานเทคโนโลยีเบื้องต้น (ป.1) — พลิกไพ่ 2 ใบ หาคู่ที่ตรงกัน (รูปอุปกรณ์ + ชื่ออุปกรณ์) ให้ครบทุกคู่โดยใช้จำนวนครั้งน้อยที่สุด</p>
<div style="text-align:center; margin-bottom:6px">
  <button class="tts-btn" data-audio-src="audio/game-desc.mp3">
    <span class="tts-icon">🔊</span> <span class="tts-label">ฟังคำอธิบายเกม</span>
  </button>
</div>

<div id="hud">
  <span class="pill">🔁 พลิกไปแล้ว: <span id="moves">0</span> ครั้ง</span>
  <span class="pill">⭐ จับคู่ได้: <span id="matches">0</span>/<span id="matches-total">5</span></span>
</div>

<div id="board"></div>

<div id="finish">
  <div class="card2">
    <div style="font-size:2.6rem">🎉</div>
    <h2>เก่งมาก! จับคู่ครบแล้ว</h2>
    <p style="color:#666;font-size:.9rem" id="finish-msg"></p>
    <button onclick="location.reload()">🔄 เล่นอีกครั้ง</button>
  </div>
</div>

<script src="../../assets/js/tts.js"></script>
<script>
const DEVICES = [
  { name:"จอมอนิเตอร์", svg:'<rect x="6" y="6" width="128" height="84" rx="10" fill="#1F2430"/><rect x="14" y="14" width="112" height="68" rx="4" fill="#60A5FA"/><rect x="60" y="96" width="20" height="10" fill="#4B5566"/><rect x="38" y="106" width="64" height="8" rx="4" fill="#334155"/>', vb:"0 0 140 120" },
  { name:"เมาส์", svg:'<path d="M50 8 C74 8 86 28 86 55 L86 82 C86 104 70 114 50 114 C30 114 14 104 14 82 L14 55 C14 28 26 8 50 8 Z" fill="#C3CBE3" stroke="#9AA5C0" stroke-width="3"/>', vb:"0 0 100 120" },
  { name:"คีย์บอร์ด", svg:'<rect x="4" y="4" width="152" height="82" rx="12" fill="#B9C0DA" stroke="#8D96B8" stroke-width="3"/><rect x="14" y="16" width="14" height="14" rx="3" fill="#fff"/><rect x="32" y="16" width="14" height="14" rx="3" fill="#fff"/><rect x="14" y="34" width="126" height="14" rx="4" fill="#fff"/>', vb:"0 0 160 90" },
  { name:"ซีพียู", svg:'<rect x="20" y="20" width="60" height="60" rx="8" fill="#4B5566"/><rect x="30" y="30" width="40" height="40" rx="4" fill="#6B7690"/><rect x="42" y="42" width="16" height="16" fill="#60A5FA"/>', vb:"0 0 100 100" },
  { name:"ลำโพง", svg:'<rect x="15" y="8" width="70" height="104" rx="12" fill="#374151"/><circle cx="50" cy="35" r="20" fill="#1F2430"/><circle cx="50" cy="35" r="14" fill="#4B5566"/><circle cx="50" cy="80" r="14" fill="#1F2430"/><circle cx="50" cy="80" r="9" fill="#4B5566"/>', vb:"0 0 100 120" }
];

// สร้างชุดการ์ด: แต่ละอุปกรณ์มี 2 ใบ (คู่กัน) แล้วสลับตำแหน่ง
let cards = [];
DEVICES.forEach((d, i) => { cards.push({ id:i, ...d }); cards.push({ id:i, ...d }); });
cards = cards.sort(() => Math.random() - 0.5);

let flipped = [];
let matchesCount = 0;
let moves = 0;
let lock = false;
document.getElementById("matches-total").textContent = DEVICES.length;

const board = document.getElementById("board");
cards.forEach((c, idx) => {
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.id = c.id;
  el.dataset.idx = idx;
  el.innerHTML = `
    <div class="card-inner">
      <div class="card-face card-back">❓</div>
      <div class="card-face card-front">
        <svg viewBox="${c.vb}">${c.svg}</svg>
        <span>${c.name}</span>
      </div>
    </div>
  `;
  el.addEventListener("click", () => flipCard(el, c.id));
  board.appendChild(el);
});

function flipCard(el, id){
  if(lock || el.classList.contains("flipped") || el.classList.contains("matched")) return;
  el.classList.add("flipped");
  flipped.push({el, id});

  if(flipped.length === 2){
    moves++;
    document.getElementById("moves").textContent = moves;
    lock = true;
    const [a, b] = flipped;
    if(a.id === b.id){
      setTimeout(() => {
        a.el.classList.add("matched");
        b.el.classList.add("matched");
        matchesCount++;
        document.getElementById("matches").textContent = matchesCount;
        flipped = [];
        lock = false;
        if(matchesCount >= DEVICES.length){
          const msg = moves <= DEVICES.length + 1
            ? "สุดยอด! ความจำดีเยี่ยมมาก 🌟"
            : "เก่งมาก! ลองเล่นอีกครั้งเพื่อทำสถิติให้ดีขึ้นได้นะ";
          const finishText = `ใช้ไป ${moves} ครั้ง — ${msg}`;
          document.getElementById("finish-msg").textContent = finishText;
          setTimeout(() => {
            document.getElementById("finish").style.display = "flex";
            speakText(`เก่งมาก จับคู่ครบแล้ว ${finishText}`, null);
          }, 500);
        }
      }, 400);
    } else {
      setTimeout(() => {
        a.el.classList.remove("flipped");
        b.el.classList.remove("flipped");
        flipped = [];
        lock = false;
      }, 800);
    }
  }
}
</script>
</body>
</html>
