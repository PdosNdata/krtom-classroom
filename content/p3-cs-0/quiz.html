<style>
  :root{ font-family:"Sarabun","TH Sarabun New",system-ui,sans-serif; font-size:28px; --c1:#60A5FA; --c2:#2563EB; }
  html,body{ margin:0; padding:0; background:#F7F8FC; color:#1F2430; line-height:1.65; }
  header{ background:linear-gradient(135deg,var(--c1),var(--c2)); color:#fff; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1{ margin:0; font-size:1.25rem; } header p{ margin:4px 0 0; font-size:.8rem; opacity:.92; }
  header a{ color:#fff; background:rgba(255,255,255,.22); padding:8px 16px; border-radius:999px; font-size:.8rem; text-decoration:none; white-space:nowrap; }
  main{ max-width:760px; margin:0 auto; padding:22px 18px 70px; }
  .card{ background:#fff; border:1px solid #E6E8F0; border-radius:20px; padding:20px; margin-bottom:18px; box-shadow:0 4px 12px rgba(0,0,0,.06); }
  .intro{ border-left:6px solid var(--c2); } .intro p{ margin:0 0 8px; font-weight:600; }
  .example{ background:#F8FAFC; border-radius:12px; padding:10px 14px; font-size:.82rem; color:#475569; }
  .field{ margin-bottom:20px; }
  .field > label,.q .t{ display:flex; align-items:flex-start; gap:10px; font-weight:800; font-size:1rem; }
  .fn,.q .no{ min-width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--c1),var(--c2)); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:.85rem; flex:none; }
  .hint{ color:#64748B; font-size:.78rem; margin:2px 0 6px 40px; }
  textarea,select,input[type=number]{ width:100%; box-sizing:border-box; border:2px solid #E2E8F0; border-radius:14px; padding:10px 12px; font:inherit; background:#fff; }
  textarea{ resize:vertical; } input[type=number]{ width:140px; }
  textarea:focus,select:focus,input:focus{ outline:none; border-color:var(--c2); box-shadow:0 0 0 4px rgba(37,99,235,.08); }
  .meter{ height:10px; background:#E5E7EB; border-radius:99px; overflow:hidden; margin:4px 0 6px; }
  .meter i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--c1),var(--c2)); transition:width .25s; }
  .meter-t{ text-align:center; font-weight:700; font-size:.85rem; color:#475569; }
  .actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
  .btn{ border:none; border-radius:999px; padding:12px 28px; font-weight:700; font-size:1rem; font-family:inherit; cursor:pointer; color:#fff; background:linear-gradient(135deg,var(--c1),var(--c2)); box-shadow:0 5px 0 rgba(0,0,0,.2), 0 10px 18px rgba(0,0,0,.15); text-decoration:none; display:inline-block; }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.2); }
  .btn.ghost{ background:#fff; color:#475569; border:2px solid #CBD5E1; box-shadow:none; }
  #status{ text-align:center; margin-top:14px; font-weight:700; min-height:1.5em; }
  .mcq{ margin-bottom:22px; } .mcq .q{ font-weight:800; margin:0 0 8px; }
  .mcq .choices label{ display:block; border:2px solid #E2E8F0; border-radius:14px; padding:9px 14px; margin:6px 0; cursor:pointer; background:#fff; }
  .mcq .choices label:has(input:checked){ border-color:var(--c2); background:#EFF6FF; }
  .mcq input{ margin-right:8px; transform:scale(1.2); }
  svg.tree{ width:100%; max-width:640px; height:auto; display:block; margin:8px auto; }
  .scene{ background:#FFFBEB; border:2px dashed #F59E0B; border-radius:16px; padding:10px 14px; margin:8px 0 10px; font-size:.9rem; }
  @media print{ header a,.actions{ display:none; } textarea{ border:1px solid #999; } }

  #progress{ text-align:center; font-weight:700; margin:10px 0; } #progress-bar{ height:10px; background:#E5E7EB; border-radius:99px; overflow:hidden; margin-top:4px; }
  #progress-fill{ height:100%; width:0; background:linear-gradient(90deg,var(--c1),var(--c2)); transition:width .25s; }
  .mcq .choices label.correct{ border-color:#10B981; background:#ECFDF5; } .mcq .choices label.wrong{ border-color:#EF4444; background:#FEF2F2; }
  #submit-btn{ display:block; margin:20px auto; border:none; border-radius:999px; padding:12px 32px; font:700 1rem Sarabun,sans-serif; color:#fff; background:linear-gradient(135deg,var(--c1),var(--c2)); cursor:pointer; }
  #result-card{ display:none; text-align:center; background:#fff; border:2px solid #C7D2FE; border-radius:20px; padding:20px; margin-top:20px; } #result-card.show{ display:block; }
  #result-card .big-score{ font-size:2rem; font-weight:800; } #result-card button{ margin-top:12px; border:none; border-radius:999px; padding:10px 24px; background:#6366F1; color:#fff; font:700 .95rem Sarabun,sans-serif; cursor:pointer; }
</style>
<link rel="stylesheet" href="../../assets/css/page-bg.css">
</head>
<body>

<header>
  <div>
    <h1>✅ แบบทดสอบ</h1>
    <p>การแสดงขั้นตอนวิธีการแก้ปัญหา · ป.3 หน่วยที่ 1 · ปรนัย 4 ตัวเลือก 10 ข้อ</p>
  </div>
  <a href="../../index.html#/unit/p3/cs/0/quiz">← กลับหน้าหน่วย</a>
</header>

<main>
  <div id="progress">ตอบแล้ว <span id="answered-count">0</span>/10 ข้อ<div id="progress-bar"><div id="progress-fill"></div></div></div>
  <form id="quiz-form"></form>
  <button id="submit-btn" onclick="submitQuiz()">📤 ส่งคำตอบ</button>
  <div id="result-card">
    <div style="font-size:2.4rem">🎉</div>
    <div class="big-score" id="score-text">0/10</div>
    <div class="msg" id="score-msg"></div>
    <button onclick="location.reload()">🔄 ทำใหม่อีกครั้ง</button>
  </div>
</main>

<script>
function shuffleArray(arr){ const a = [...arr]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shuffleChoices(q){ const idx = shuffleArray(q.choices.map((_, i) => i)); return { q:q.q, choices: idx.map(i => q.choices[i]), correct: idx.indexOf(q.correct) }; }
const RAW_QUESTIONS = [{"q": "ข้อใดคือขั้นตอนแรกของการแก้ปัญหา", "choices": ["ลงมือทำทันที", "ทำความเข้าใจปัญหา", "สรุปผล", "ถามเพื่อนทุกครั้ง"], "correct": 1}, {"q": "หลังจากลงมือแก้ปัญหาตามแผนแล้ว ควรทำอะไรต่อ", "choices": ["ตรวจสอบว่าปัญหาแก้ได้แล้วหรือยัง", "เริ่มปัญหาใหม่ทันที", "ลบแผนทิ้ง", "ไม่ต้องทำอะไร"], "correct": 0}, {"q": "\"ข้อมูล\" ของปัญหา หมายถึงข้อใด", "choices": ["สิ่งที่เรารู้แล้วในปัญหา", "ผลลัพธ์สุดท้าย", "ความรู้สึกของผู้แก้ปัญหา", "เวลาที่ใช้แก้ปัญหา"], "correct": 0}, {"q": "ข้อใดเป็น \"เงื่อนไข\" ของปัญหา", "choices": ["ซื้อขนมราคา 10 บาท", "ต้องซื้อนมอย่างน้อย 1 กล่อง", "แม่ให้เงิน 50 บาท", "ร้านค้าอยู่หน้าโรงเรียน"], "correct": 1}, {"q": "มายกับเมย์มีหมวกคนละใบ สีแดงกับสีเหลือง มายไม่ชอบสีเหลือง จึงเลือกสีแดง เมย์ได้หมวกสีอะไร", "choices": ["สีแดง", "สีเหลือง", "สีแดงและสีเหลือง", "ตอบไม่ได้"], "correct": 1}, {"q": "เสื้อ 2 สี กางเกง 3 สี เลือกอย่างละ 1 ตัว แต่งได้ทั้งหมดกี่แบบ", "choices": ["5 แบบ", "6 แบบ", "8 แบบ", "9 แบบ"], "correct": 1}, {"q": "เรียงลูกโป่ง 3 สีเป็นแถว ได้ทั้งหมดกี่แบบ", "choices": ["3 แบบ", "4 แบบ", "6 แบบ", "9 แบบ"], "correct": 2}, {"q": "ข้อใดเป็นการแสดงอัลกอริทึมแบบ \"เขียนบอกเล่า\"", "choices": ["1) เปิดน้ำ 2) ถูสบู่ 3) ล้างมือ", "วงรีและลูกศร", "ภาพการ์ตูน 4 ช่อง", "แผนภาพต้นไม้"], "correct": 0}, {"q": "ในผังงาน รูปข้าวหลามตัดใช้ทำอะไร", "choices": ["เริ่มต้นผังงาน", "ตัดสินใจ ใช่/ไม่ใช่", "เขียนข้อความทั่วไป", "จบผังงาน"], "correct": 1}, {"q": "แผนภาพต้นไม้ช่วยเราในเรื่องใด", "choices": ["วาดรูปต้นไม้ให้สวย", "แจกแจงทางเลือกให้เห็นทุกแบบ", "ทำให้ตอบเร็วโดยไม่ต้องคิด", "หาเงื่อนไขของปัญหา"], "correct": 1}];
const QUESTIONS = shuffleArray(RAW_QUESTIONS.map(shuffleChoices));
const form = document.getElementById("quiz-form");
QUESTIONS.forEach((item, i) => {
  const div = document.createElement("div"); div.className = "mcq"; div.dataset.correct = item.correct;
  const letters = ["ก.", "ข.", "ค.", "ง."];
  div.innerHTML = `<div id="quiz-content-${i}"><p class="q">${i + 1}. ${item.q}</p><div class="choices">${item.choices.map((c, ci) => `<label><input type="radio" name="q${i}" value="${ci}" onchange="updateProgress()"> ${letters[ci]} ${c}</label>`).join("")}</div></div>`;
  form.appendChild(div);
});
function updateProgress(){ const a = document.querySelectorAll(".mcq input:checked").length; document.getElementById("answered-count").textContent = a; document.getElementById("progress-fill").style.width = (a / QUESTIONS.length * 100) + "%"; }
function submitQuiz(){
  let score = 0;
  document.querySelectorAll(".mcq").forEach(q => {
    const correct = parseInt(q.dataset.correct, 10), chosen = q.querySelector("input:checked");
    q.querySelectorAll("label").forEach(l => l.classList.remove("correct", "wrong"));
    const cl = q.querySelectorAll("label")[correct];
    if(chosen){ if(parseInt(chosen.value, 10) === correct){ chosen.closest("label").classList.add("correct"); score++; } else { chosen.closest("label").classList.add("wrong"); cl.classList.add("correct"); } }
    else cl.classList.add("correct");
  });
  const pct = Math.round(score / QUESTIONS.length * 100);
  const msg = pct === 100 ? "🌟 ยอดเยี่ยมมาก! ตอบถูกครบทุกข้อ" : pct >= 80 ? "👏 เก่งมาก! เข้าใจเนื้อหาดีมาก" : pct >= 60 ? "😊 ทำได้ดี! ลองทบทวนใบความรู้อีกครั้งนะ" : "💪 ลองกลับไปอ่านใบความรู้แล้วทำใหม่อีกครั้งนะ";
  document.getElementById("score-text").textContent = `${score}/${QUESTIONS.length}`;
  document.getElementById("score-msg").textContent = msg + ` (${pct}%)`;
  document.getElementById("result-card").classList.add("show");
  document.getElementById("result-card").scrollIntoView({ behavior:"smooth" });
}
</script>
