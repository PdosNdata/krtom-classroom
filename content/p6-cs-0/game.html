<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมพลิกไพ่ความจำ: สัญลักษณ์ผังงาน — ป.6 หน่วย 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tts.css">
<style>
  :root{ font-family:"Sarabun","TH Sarabun New",system-ui,sans-serif; font-size:16px; }
  html,body{ margin:0; padding:0; background:#F7F8FC; color:#1F2430; }
  header{ background:linear-gradient(135deg,#EC4899,#F97316); color:#fff; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1{ margin:0; font-size:1.05rem; }
  header a{ color:#fff; background:rgba(255,255,255,.22); padding:8px 16px; border-radius:999px; font-size:.82rem; text-decoration:none; }

  p.desc{ max-width:600px; margin:14px auto 0; padding:0 20px; font-size:.9rem; color:#555; text-align:center; }

  #hud{ max-width:500px; margin:14px auto 0; padding:0 20px; display:flex; justify-content:center; gap:10px; }
  #hud .pill{ background:#fff; border:1px solid #E6E8F0; border-radius:999px; padding:7px 16px; font-weight:700; font-size:.88rem; box-shadow:0 4px 10px rgba(0,0,0,.06); }
  #set-note{ text-align:center; font-size:.85rem; color:#EC4899; font-weight:700; margin:10px 0 0; }

  #board{ max-width:460px; margin:20px auto 40px; padding:0 20px; display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  @media (max-width:360px){ #board{ grid-template-columns:repeat(2, 1fr); } }

  .card{ aspect-ratio:3/4; border-radius:12px; cursor:pointer; position:relative; perspective:600px; }
  .card-inner{ width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .4s; }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .card-face{ position:absolute; inset:0; border-radius:12px; display:flex; align-items:center; justify-content:center; backface-visibility:hidden; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .card-back{ background:linear-gradient(135deg,#8B5CF6,#3B82F6); font-size:1.6rem; }
  .card-front{ background:#fff; transform:rotateY(180deg); padding:6px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .card-front svg{ width:70%; height:50%; }
  .card-front .label{ font-size:.62rem; font-weight:700; color:#3B82F6; }
  .card-front .meaning{ font-size:.66rem; font-weight:600; line-height:1.3; }
  .card.matched .card-front{ background:#F0FBF6; border:2px solid #10B981; }

  #finish{ position:fixed; inset:0; background:rgba(20,10,30,.55); z-index:40; display:none; align-items:center; justify-content:center; padding:20px; }
  #finish .card2{ background:#fff; border-radius:22px; padding:32px 24px; text-align:center; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  #finish button{ margin-top:14px; padding:11px 26px; border:none; border-radius:999px; background:#10B981; color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>🎮 เกมพลิกไพ่ความจำ: สัญลักษณ์ผังงาน</h1>
  <a href="../../index.html#/unit/p6/cs/0/game">← กลับหน้าหน่วย</a>
</header>

<p class="desc" id="game-desc">หน่วยที่ 1 การแก้ปัญหาโดยใช้เหตุผลเชิงตรรกะ (ป.6) — พลิกไพ่ 2 ใบ จับคู่รูปสัญลักษณ์ผังงานกับความหมายของสัญลักษณ์นั้นให้ถูกต้อง ให้ครบทุกคู่โดยใช้จำนวนครั้งน้อยที่สุด</p>
<div style="text-align:center; margin-bottom:6px">
  <button class="tts-btn" data-audio-src="audio/game-desc.mp3">
    <span class="tts-icon">🔊</span> <span class="tts-label">ฟังคำอธิบายเกม</span>
  </button>
</div>

<div id="hud">
  <span class="pill">🔁 พลิกไปแล้ว: <span id="moves">0</span> ครั้ง</span>
  <span class="pill">⭐ จับคู่ได้: <span id="matches">0</span>/<span id="matches-total">5</span></span>
</div>
<p id="set-note"></p>

<div id="board"></div>

<div id="finish">
  <div class="card2">
    <div style="font-size:2.6rem">🎉</div>
    <h2>เก่งมาก! จับคู่ครบแล้ว</h2>
    <p style="color:#666;font-size:.9rem" id="finish-msg"></p>
    <button onclick="location.reload()">🔄 เล่นอีกครั้ง</button>
  </div>
</div>

<script src="../../assets/js/tts.js"></script>
<script>
const ITEMS = [
  { name:"สี่เหลี่ยมขอบมน", meaning:"จุดเริ่มต้น หรือ จุดสิ้นสุดของงาน", svg:'<rect x="10" y="20" width="120" height="40" rx="20" fill="#DBEAFE" stroke="#3B82F6" stroke-width="5"/>', vb:"0 0 140 80" },
  { name:"สี่เหลี่ยมผืนผ้า", meaning:"ขั้นตอนการประมวลผล หรือการกระทำ", svg:'<rect x="10" y="10" width="120" height="60" rx="6" fill="#F0FBF6" stroke="#10B981" stroke-width="5"/>', vb:"0 0 140 80" },
  { name:"สี่เหลี่ยมขอบเอียง", meaning:"การนำเข้าข้อมูลด้วยการป้อนค่าทางแป้นพิมพ์", svg:'<polygon points="15,30 125,15 125,65 15,65" fill="#FEE2E2" stroke="#EF4444" stroke-width="5"/>', vb:"0 0 140 80" },
  { name:"สี่เหลี่ยมด้านขนาน", meaning:"การรับข้อมูลเข้า หรือแสดงผลออก", svg:'<polygon points="26,10 134,10 114,70 6,70" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="5"/>', vb:"0 0 140 80" },
  { name:"จอแสดงผล", meaning:"การแสดงผลลัพธ์บนหน้าจอ", svg:'<polygon points="35,15 125,15 125,65 35,65 10,40" fill="#CFFAFE" stroke="#06B6D4" stroke-width="5"/>', vb:"0 0 140 80" },
  { name:"สี่เหลี่ยมขนมเปียกปูน", meaning:"จุดตัดสินใจ ที่มีคำตอบ ใช่/ไม่ใช่", svg:'<polygon points="70,6 134,40 70,74 6,40" fill="#FEF3C7" stroke="#F59E0B" stroke-width="5"/>', vb:"0 0 140 80" },
  { name:"ลูกศร", meaning:"บอกทิศทางการทำงานว่าไปขั้นตอนไหนต่อ", svg:'<line x1="20" y1="40" x2="100" y2="40" stroke="#EC4899" stroke-width="7" stroke-linecap="round"/><polygon points="100,22 132,40 100,58" fill="#EC4899"/>', vb:"0 0 140 80" },
  { name:"จุดเชื่อมต่อ", meaning:"เชื่อมต่อเส้นทางการไหลภายในหน้าเดียวกัน", svg:'<circle cx="70" cy="40" r="30" fill="#FEF3C7" stroke="#F59E0B" stroke-width="5"/>', vb:"0 0 140 80" },
  { name:"จุดเชื่อมต่อไปหน้าถัดไป", meaning:"เชื่อมต่อเส้นทางการไหลไปยังหน้ากระดาษอื่น", svg:'<polygon points="20,15 120,15 120,50 70,72 20,50" fill="#DBEAFE" stroke="#3B82F6" stroke-width="5"/>', vb:"0 0 140 80" },
  { name:"กระบวนการย่อย", meaning:"การทำงานที่กำหนดไว้แล้ว หรือโปรแกรมย่อย", svg:'<rect x="15" y="15" width="110" height="50" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="5"/><line x1="35" y1="15" x2="35" y2="65" stroke="#8B5CF6" stroke-width="5"/><line x1="105" y1="15" x2="105" y2="65" stroke="#8B5CF6" stroke-width="5"/>', vb:"0 0 140 80" },
  { name:"เอกสาร", meaning:"ข้อมูลในรูปแบบเอกสาร เช่น รายงาน", svg:'<path d="M15,15 H125 V50 Q100,65 70,52 Q40,40 15,55 Z" fill="#FCE7F3" stroke="#EC4899" stroke-width="5"/>', vb:"0 0 140 80" }
];

const SETS = [ITEMS.slice(0, 5), ITEMS.slice(5, 11)];
let setIndex = 0;
let matchesInSet = 0;

let flipped = [];
let matchesCount = 0;
let moves = 0;
let lock = false;
document.getElementById("matches-total").textContent = ITEMS.length;

const board = document.getElementById("board");
const setNoteEl = document.getElementById("set-note");

function renderSet(idx){
  board.innerHTML = "";
  flipped = [];
  lock = false;
  matchesInSet = 0;
  setNoteEl.textContent = `ชุดที่ ${idx + 1} / ${SETS.length} (${SETS[idx].length} สัญลักษณ์)`;

  let cards = [];
  SETS[idx].forEach((d, i) => {
    cards.push({ id:d.name, kind:"symbol", ...d });
    cards.push({ id:d.name, kind:"meaning", ...d });
  });
  cards = cards.sort(() => Math.random() - 0.5);

  cards.forEach((c, idx2) => {
    const el = document.createElement("div");
    el.className = "card";
    el.dataset.id = c.id;
    el.dataset.idx = idx2;
    const frontContent = c.kind === "symbol"
      ? `<svg viewBox="${c.vb}">${c.svg}</svg><span class="label">${c.name}</span>`
      : `<span class="meaning">${c.meaning}</span>`;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">❓</div>
        <div class="card-face card-front">
          ${frontContent}
        </div>
      </div>
    `;
    el.addEventListener("click", () => flipCard(el, c.id));
    board.appendChild(el);
  });
}
renderSet(setIndex);

function flipCard(el, id){
  if(lock || el.classList.contains("flipped") || el.classList.contains("matched")) return;
  el.classList.add("flipped");
  flipped.push({el, id});

  if(flipped.length === 2){
    moves++;
    document.getElementById("moves").textContent = moves;
    lock = true;
    const [a, b] = flipped;
    if(a.id === b.id){
      setTimeout(() => {
        a.el.classList.add("matched");
        b.el.classList.add("matched");
        matchesCount++;
        matchesInSet++;
        document.getElementById("matches").textContent = matchesCount;
        flipped = [];
        lock = false;
        if(matchesInSet >= SETS[setIndex].length){
          if(setIndex + 1 < SETS.length){
            setTimeout(() => {
              setIndex++;
              renderSet(setIndex);
            }, 900);
          } else {
            const msg = moves <= ITEMS.length + 1
              ? "สุดยอด! ความจำดีเยี่ยมมาก 🌟"
              : "เก่งมาก! ลองเล่นอีกครั้งเพื่อทำสถิติให้ดีขึ้นได้นะ";
            const finishText = `ใช้ไป ${moves} ครั้ง — ${msg}`;
            document.getElementById("finish-msg").textContent = finishText;
            setTimeout(() => {
              document.getElementById("finish").style.display = "flex";
              speakText(`เก่งมาก จับคู่ครบแล้ว ${finishText}`, null);
            }, 500);
          }
        }
      }, 400);
    } else {
      setTimeout(() => {
        a.el.classList.remove("flipped");
        b.el.classList.remove("flipped");
        flipped = [];
        lock = false;
      }, 800);
    }
  }
}
</script>
</body>
</html>
