<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมพลิกไพ่ บล็อกคำสั่ง Scratch — ม.1 หน่วย 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tts.css">
<style>
  :root{ font-family:"Sarabun","TH Sarabun New",system-ui,sans-serif; font-size:24px; }
  html,body{ margin:0; padding:0; background:#F7F8FC; color:#1F2430; }
  header{ background:linear-gradient(135deg,#F59E0B,#F97316); color:#fff; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1{ margin:0; font-size:1.05rem; }
  header a{ color:#fff; background:rgba(255,255,255,.22); padding:8px 16px; border-radius:999px; font-size:.82rem; text-decoration:none; }
  p.desc{ max-width:640px; margin:14px auto 0; padding:0 20px; font-size:.9rem; color:#555; text-align:center; }
  #hud{ max-width:560px; margin:14px auto 0; padding:0 20px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  #hud .pill{ background:#fff; border:1px solid #E6E8F0; border-radius:999px; padding:7px 16px; font-weight:700; font-size:.88rem; box-shadow:0 4px 10px rgba(0,0,0,.06); }
  #board{ max-width:780px; margin:20px auto 40px; padding:0 14px; display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  @media (max-width:520px){ #board{ grid-template-columns:repeat(3, 1fr); gap:8px; } }

  .card{ aspect-ratio:1/1; border-radius:14px; cursor:pointer; position:relative; perspective:600px; }
  .card-inner{ width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .4s; }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .card-face{ position:absolute; inset:0; border-radius:14px; display:flex; align-items:center; justify-content:center; backface-visibility:hidden; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .card-back{ background:linear-gradient(135deg,#F59E0B,#EA580C); font-size:1.7rem; color:#fff; }
  .card-front{ transform:rotateY(180deg); padding:6px; text-align:center; flex-direction:column; gap:2px; overflow:hidden; }
  .card-front.term{ background:#EFF6FF; border:2px solid #93C5FD; }
  .card-front.meaning{ background:#FFFBEB; border:2px solid #FCD34D; }
  .card-front .emoji{ font-size:1.5rem; line-height:1.1; }
  .card-front .name{ font-size:.62rem; font-weight:700; line-height:1.2; }
  .card-front.meaning .name{ font-weight:500; font-size:.58rem; }
  .card.matched .card-front{ background:#F0FBF6; border-color:#10B981; }

  #finish{ position:fixed; inset:0; background:rgba(20,10,30,.55); z-index:40; display:none; align-items:center; justify-content:center; padding:20px; }
  #finish .card2{ background:#fff; border-radius:22px; padding:32px 24px; text-align:center; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  #finish button{ margin-top:14px; padding:11px 26px; border:none; border-radius:999px; background:#10B981; color:#fff; font-weight:700; font-size:1rem; cursor:pointer; font-family:inherit; }
</style>
<link rel="stylesheet" href="../../assets/css/page-bg.css">
</head>
<body>

<header>
  <h1>🧩 เกมพลิกไพ่ บล็อกคำสั่ง Scratch</h1>
  <a href="../../index.html#/unit/m1/cs/1/game">← กลับหน้าหน่วย</a>
</header>

<p class="desc" id="game-desc">พลิกไพ่ 2 ใบ จับคู่ "ชื่อบล็อกคำสั่ง" (ไพ่สีฟ้า) กับ "หน้าที่ของบล็อก" (ไพ่สีเหลือง) ให้ครบทั้ง 8 คู่ — เมื่อจับคู่ถูกจะมีเสียงอ่านให้ฟัง</p>
<div style="text-align:center; margin-bottom:6px">
  <button class="tts-btn" data-audio-src="audio/sc-desc.mp3">
    <span class="tts-icon">🔊</span> <span class="tts-label">ฟังคำอธิบายเกม</span>
  </button>
</div>

<div id="hud">
  <span class="pill">🔁 พลิกไปแล้ว: <span id="moves">0</span> ครั้ง</span>
  <span class="pill">⭐ จับคู่ได้: <span id="matches">0</span>/<span id="matches-total">8</span></span>
</div>

<div id="board"></div>

<div id="finish">
  <div class="card2">
    <div style="font-size:2.6rem">🎉</div>
    <h2>เก่งมาก! จับคู่ครบแล้ว</h2>
    <p style="color:#666;font-size:.9rem" id="finish-msg"></p>
    <button onclick="location.reload()">🔄 เล่นอีกครั้ง</button>
  </div>
</div>

<script src="../../assets/js/tts.js?v=2"></script>
<script src="../../assets/js/sfx.js?v=1"></script>
<script>
// เรียบเรียงใหม่จากแนวสื่อ DLTV วิทยาการคำนวณ ม.1 หน่วยที่ 2 (dltv.ac.th)
const PAIRS = [
  { term:"เมื่อกดธงเขียว", emoji:"🟩", meaning:"เริ่มการทำงานของโปรแกรม" },
  { term:"ทำซ้ำไม่รู้จบ (forever)", emoji:"♾️", meaning:"ทำคำสั่งข้างในซ้ำไปเรื่อย ๆ" },
  { term:"ทำซ้ำ n รอบ (repeat)", emoji:"🔢", meaning:"วนซ้ำตามจำนวนรอบที่รู้แน่นอน" },
  { term:"ตัวแปร (variable)", emoji:"📦", meaning:"ชื่อที่ใช้เก็บค่า และเปลี่ยนค่าได้" },
  { term:"ถามและรอคำตอบ", emoji:"⌨️", meaning:"รับข้อมูลจากผู้ใช้ เก็บไว้ในค่าคำตอบ" },
  { term:"ถ้า … แล้ว (if)", emoji:"🔀", meaning:"ตรวจเงื่อนไขก่อนเลือกทำคำสั่ง" },
  { term:"รอ … วินาที", emoji:"⏱️", meaning:"หยุดรอตามเวลาที่กำหนด" },
  { term:"สลับชุดตัวละคร", emoji:"👕", meaning:"เปลี่ยนท่าทางไปชุดถัดไป" }
];

let cards = [];
PAIRS.forEach((p, i) => {
  cards.push({ id:i, kind:"term", emoji:p.emoji, text:p.term });
  cards.push({ id:i, kind:"meaning", emoji:"", text:p.meaning });
});
cards = cards.sort(() => Math.random() - 0.5);

let flipped = [], matchesCount = 0, moves = 0, lock = false;
document.getElementById("matches-total").textContent = PAIRS.length;

const board = document.getElementById("board");
cards.forEach((c, idx) => {
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.id = c.id; el.dataset.idx = idx;
  el.innerHTML = `
    <div class="card-inner">
      <div class="card-face card-back">❓</div>
      <div class="card-face card-front ${c.kind}">
        ${c.emoji ? `<span class="emoji">${c.emoji}</span>` : ""}
        <span class="name">${c.text}</span>
      </div>
    </div>`;
  el.addEventListener("click", () => flipCard(el, c.id));
  board.appendChild(el);
});

function flipCard(el, id){
  if(lock || el.classList.contains("flipped") || el.classList.contains("matched")) return;
  el.classList.add("flipped"); if(window.sfx) sfx.pop();
  flipped.push({ el, id });
  if(flipped.length < 2) return;

  moves++;
  document.getElementById("moves").textContent = moves;
  lock = true;
  const [a, b] = flipped;
  if(a.id === b.id && a.el !== b.el && a.el.querySelector(".term") !== b.el.querySelector(".term")){
    setTimeout(() => {
      a.el.classList.add("matched"); b.el.classList.add("matched");
      if(window.sfx) sfx.correct();
      try{ playAudio("audio/sc-" + a.id + ".mp3", null); }catch(e){}
      matchesCount++;
      document.getElementById("matches").textContent = matchesCount;
      flipped = []; lock = false;
      if(matchesCount >= PAIRS.length){
        const msg = moves <= PAIRS.length + 3 ? "สุดยอด! ความจำดีเยี่ยมมาก 🌟" : "เก่งมาก! ลองเล่นอีกครั้งเพื่อทำสถิติให้ดีขึ้นได้นะ";
        const finishText = `ใช้ไป ${moves} ครั้ง — ${msg}`;
        document.getElementById("finish-msg").textContent = finishText;
        setTimeout(() => {
          document.getElementById("finish").style.display = "flex"; if(window.sfx) sfx.win();
          try{ speakText(`เก่งมาก จับคู่ครบแล้ว ${finishText}`, null); }catch(e){}
        }, 2600);
      }
    }, 450);
  }else{
    setTimeout(() => {
      if(window.sfx) sfx.wrong();
      a.el.classList.remove("flipped"); b.el.classList.remove("flipped");
      flipped = []; lock = false;
    }, 900);
  }
}
</script>
</body>
</html>
