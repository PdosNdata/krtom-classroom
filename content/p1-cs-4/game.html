<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมพลิกไพ่ความจำ: เหมือนหรือต่าง — ป.1 หน่วย 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tts.css">
<style>
  :root{ font-family:"Sarabun","TH Sarabun New",system-ui,sans-serif; font-size:36px; } /* ป.1-3: เนื้อหา 36px */
  html,body{ margin:0; padding:0; background:#F7F8FC; color:#1F2430; }
  header{
    background:linear-gradient(135deg,#EC4899,#F97316);
    color:#fff; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{ margin:0; font-size:42px; }
  #finish h2{ margin:8px 0; font-size:42px; }
  header a{ color:#fff; background:rgba(255,255,255,.22); padding:8px 16px; border-radius:999px; font-size:.82rem; text-decoration:none; }

  p.desc{ max-width:600px; margin:14px auto 0; padding:0 20px; font-size:.9rem; color:#555; text-align:center; }

  #hud{ max-width:900px; margin:14px auto 0; padding:0 20px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  #hud .pill{ white-space:nowrap; background:#fff; border:1px solid #E6E8F0; border-radius:999px; padding:7px 16px; font-weight:700; font-size:.88rem; box-shadow:0 4px 10px rgba(0,0,0,.06); }

  #board{ max-width:920px; margin:20px auto 40px; padding:0 20px; display:grid; grid-template-columns:repeat(5, 1fr); gap:14px; }

  .card{
    aspect-ratio:1/1.12; border-radius:12px; cursor:pointer; position:relative;
    perspective:600px;
  }
  .card-inner{
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transition:transform .4s;
  }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .card-face{
    position:absolute; inset:0; border-radius:12px; display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; box-shadow:0 3px 8px rgba(0,0,0,.12);
  }
  .card-back{ background:linear-gradient(135deg,#8B5CF6,#3B82F6); font-size:1.6rem; }
  .card-front{
    background:#fff; transform:rotateY(180deg); padding:6px; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  .card-front .emoji{ font-size:1.7rem; line-height:1.15; white-space:nowrap; }
  .card-front span.name{ font-size:.52rem; font-weight:700; line-height:1.2; }
  .card.matched .card-front{ background:#F0FBF6; border:2px solid #10B981; }

  #finish{
    position:fixed; inset:0; background:rgba(20,10,30,.55); z-index:40;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  #finish .card2{ background:#fff; border-radius:22px; padding:32px 24px; text-align:center; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  #finish button{ margin-top:14px; padding:11px 26px; border:none; border-radius:999px; background:#10B981; color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
  @media (max-width:700px){ #board{ grid-template-columns:repeat(3, 1fr); gap:8px; padding:0 10px; } .card{ aspect-ratio:1/1.05; } .card{ aspect-ratio:1/1.2; } .card-front .emoji{ font-size:1rem; } .card-front span.name{ font-size:.42rem; } .card-front{ padding:4px; gap:2px; } }
</style>
<link rel="stylesheet" href="../../assets/css/page-bg.css">
</head>
<body>

<header>
  <h1>🎮 เกมพลิกไพ่ความจำ: เหมือนหรือต่าง</h1>
  <a href="../../index.html#/unit/p1/cs/4/game">← กลับหน้าหน่วย</a>
</header>

<p class="desc" id="game-desc">หน่วยที่ 5 การเปรียบเทียบ (ป.1) — พลิกไพ่ 2 ใบ หาคู่ที่ตรงกัน คือภาพกับสิ่งที่ใช้เปรียบเทียบ ให้ครบทุกคู่ โดยใช้จำนวนครั้งน้อยที่สุด</p>
<div style="text-align:center; margin-bottom:6px">
  <button class="tts-btn" data-audio-src="audio/game-desc.mp3">
    <span class="tts-icon">🔊</span> <span class="tts-label">ฟังคำอธิบายเกม</span>
  </button>
</div>

<div id="hud">
  <span class="pill">🔁 พลิกไปแล้ว: <span id="moves">0</span> ครั้ง</span>
  <span class="pill">🎯 รอบที่ <span id="round-no">1</span>/<span id="rounds-total">2</span></span>
  <span class="pill">⭐ จับคู่ได้: <span id="matches">0</span>/<span id="matches-total">5</span></span>
</div>

<div id="board"></div>

<div id="round-done" style="position:fixed;inset:0;background:rgba(20,10,30,.55);z-index:40;display:none;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:22px;padding:32px 24px;text-align:center;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)">
    <div style="font-size:2.6rem">⭐</div>
    <h2 style="margin:8px 0;font-size:42px">เก่งมาก!</h2>
    <p style="color:#666;font-size:.9rem" id="round-done-msg"></p>
    <button style="margin-top:14px;padding:11px 26px;border:none;border-radius:999px;background:#3B82F6;color:#fff;font-weight:700;font-size:1rem;cursor:pointer" onclick="nextRound()">▶️ ไปรอบต่อไป</button>
  </div>
</div>
<div id="finish">
  <div class="card2">
    <div style="font-size:2.6rem">🎉</div>
    <h2>เก่งมาก! จับคู่ครบแล้ว</h2>
    <p style="color:#666;font-size:.9rem" id="finish-msg"></p>
    <button onclick="location.reload()">🔄 เล่นอีกครั้ง</button>
  </div>
</div>

<script src="../../assets/js/tts.js?v=2"></script>
<script src="../../assets/js/sfx.js?v=1"></script>
<script>
const STEPS = [[{"name": "แอปเปิล · สตรอว์เบอร์รี", "emoji": "🍎🍓"}, {"name": "สี", "emoji": "🎨"}], [{"name": "ลูกฟุตบอล · ลูกบาส", "emoji": "⚽🏀"}, {"name": "รูปทรง", "emoji": "⭕"}], [{"name": "ช้าง · หนู", "emoji": "🐘🐭"}, {"name": "ขนาด", "emoji": "📏"}], [{"name": "กรรไกร · สีเทียน", "emoji": "✂️🖍️"}, {"name": "การใช้งาน", "emoji": "🛠️"}], [{"name": "หาจากบนลงล่าง", "emoji": "🔎"}, {"name": "ค้นหาอย่างเป็นระบบ", "emoji": "⬇️"}], [{"name": "อยากวาดแล้วลบแก้ได้", "emoji": "🖼️"}, {"name": "ดินสอ", "emoji": "✏️"}], [{"name": "ไปเที่ยวภูเขา ใส่ของเยอะ", "emoji": "⛰️"}, {"name": "กระเป๋าเป้", "emoji": "🎒"}], [{"name": "เก็บของเล่นให้หาง่าย", "emoji": "🧸"}, {"name": "แยกตามประเภท", "emoji": "📦"}], [{"name": "เกมจับผิดภาพ", "emoji": "🧩"}, {"name": "หาจุดที่ต่างกัน", "emoji": "👀"}], [{"name": "นับสตรอว์เบอร์รีในตะกร้า", "emoji": "🍓🧺"}, {"name": "นับจากซ้ายไปขวา", "emoji": "➡️"}]];
// เล่นเป็นรอบ รอบละ 5 คู่ (ทั้งหมด STEPS.length คู่)
const PER_ROUND = 5;
const ROUNDS = Math.ceil(STEPS.length / PER_ROUND);
let round = 0, flipped = [], matchesCount = 0, moves = 0, lock = false;
const board = document.getElementById("board");

function startRound(){
  const set = STEPS.slice(round * PER_ROUND, (round + 1) * PER_ROUND);
  let cards = [];
  set.forEach((d, i) => { cards.push({ id:i, ...d[0] }); cards.push({ id:i, ...d[1] }); });
  cards = cards.sort(() => Math.random() - 0.5);
  flipped = []; matchesCount = 0; lock = false;
  document.getElementById("round-no").textContent = round + 1;
  document.getElementById("matches").textContent = 0;
  document.getElementById("matches-total").textContent = set.length;
  board.innerHTML = "";
  cards.forEach((c, idx) => {
    const el = document.createElement("div");
    el.className = "card";
    el.dataset.id = c.id;
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">❓</div>
        <div class="card-face card-front">
          <span class="emoji">${c.emoji}</span>
          <span class="name">${c.name}</span>
        </div>
      </div>
    `;
    el.addEventListener("click", () => flipCard(el, c.id, set.length));
    board.appendChild(el);
  });
}
document.getElementById("rounds-total").textContent = ROUNDS;

function flipCard(el, id, setSize){
  if(lock || el.classList.contains("flipped") || el.classList.contains("matched")) return;
  el.classList.add("flipped"); if(window.sfx) sfx.pop();
  flipped.push({el, id});

  if(flipped.length === 2){
    moves++;
    document.getElementById("moves").textContent = moves;
    lock = true;
    const [a, b] = flipped;
    if(a.id === b.id){
      setTimeout(() => {
        a.el.classList.add("matched"); if(window.sfx) sfx.correct();
        b.el.classList.add("matched");
        matchesCount++;
        document.getElementById("matches").textContent = matchesCount;
        flipped = [];
        lock = false;
        if(matchesCount >= setSize){
          if(round + 1 < ROUNDS){
            setTimeout(() => {
              document.getElementById("round-done-msg").textContent = `จับคู่ครบ ${setSize} คู่แล้ว เตรียมไปรอบที่ ${round + 2}`;
              document.getElementById("round-done").style.display = "flex"; if(window.sfx) sfx.win();
              speakText(`เก่งมาก จับคู่ครบ ${setSize} คู่แล้ว ไปรอบต่อไปกันเลย`, null);
            }, 500);
          } else {
            const msg = moves <= STEPS.length + 4
              ? "สุดยอด! ความจำดีเยี่ยมมาก 🌟"
              : "เก่งมาก! ลองเล่นอีกครั้งเพื่อทำสถิติให้ดีขึ้นได้นะ";
            const finishText = `ใช้ไป ${moves} ครั้ง — ${msg}`;
            document.getElementById("finish-msg").textContent = finishText;
            setTimeout(() => {
              document.getElementById("finish").style.display = "flex"; if(window.sfx) sfx.win();
              speakText(`เก่งมาก จับคู่ครบทุกรอบแล้ว ${finishText}`, null);
            }, 500);
          }
        }
      }, 400);
    } else {
      if(window.sfx) setTimeout(() => sfx.nope(), 350);
      setTimeout(() => {
        a.el.classList.remove("flipped");
        b.el.classList.remove("flipped");
        flipped = [];
        lock = false;
      }, 800);
    }
  }
}
function nextRound(){ document.getElementById("round-done").style.display = "none"; round++; startRound(); }
startRound();
</script>
</body>
</html>
