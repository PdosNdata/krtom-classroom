<script>
(()=>{
const root=document.getElementById('math-drop'),q=s=>root.querySelector(s),settings=[{max:10,seconds:16},{max:30,seconds:12},{max:99,seconds:8}];
let level=0,target=9,score=0,round=0,lives=3,choices=[],running=false,paused=false,progress=0,last=0;
const sessionOrigin=Date.now().toString(36)+Math.random().toString(36).slice(2);
let soundEnabled=true,audioContext=null;
function sound(correct=true){if(!soundEnabled)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext=audioContext||new Audio();audioContext.resume().catch(()=>{});[correct?523:330,correct?659:262,correct?784:220].forEach((frequency,i)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),t=audioContext.currentTime+i*.1;oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.055,t+.015);gain.gain.exponentialRampToValueAtTime(.001,t+.18);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(t);oscillator.stop(t+.2);});}catch(e){}}
function speak(message){if(!soundEnabled||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;try{window.speechSynthesis.cancel();const speech=new window.SpeechSynthesisUtterance(message);speech.lang='th-TH';speech.rate=.85;const voice=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('th'));if(voice)speech.voice=voice;window.speechSynthesis.speak(speech);}catch(e){}}
q('[data-sound]').onclick=()=>{soundEnabled=!soundEnabled;q('[data-sound]').textContent=soundEnabled?'เสียง: เปิด':'เสียง: ปิด';q('[data-sound]').setAttribute('aria-pressed',String(soundEnabled));if(soundEnabled){sound();speak('เปิดเสียงแล้ว');}else{window.speechSynthesis?.cancel();}};
root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.matches('[data-pause]')){window.speechSynthesis?.cancel();return;}if(button.matches('[data-start]')){sound();speak('เริ่มเลย เลือกบล็อกที่มีคำตอบเท่ากับ '+target);}});
const feedbackObserver=new MutationObserver(()=>{const message=q('.message').textContent;if(message.startsWith('ถูกต้อง!')){sound(true);speak(round===10?'เก่งมาก ผ่านด่านแล้ว':'เก่งมาก ถูกต้องแล้ว ข้อต่อไป หาคำตอบเท่ากับ '+target);}else if(message.includes('ยังไม่ตรง')||message.startsWith('หมดเวลา')){sound(false);speak(lives===0?'ไม่เป็นไร ลองเล่นใหม่ได้นะ':'ลองอีกครั้งนะ ข้อต่อไป หาคำตอบเท่ากับ '+target);}});feedbackObserver.observe(q('.message'),{childList:true,characterData:true,subtree:true});
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function expression(value,max){if(Math.random()<.5||value===max){let a=rand(0,value);return{a,b:value-a,op:'+',value};}let b=rand(0,max-value);return{a:value+b,b,op:'−',value};}
function makeRound(){let max=settings[level].max;target=rand(1,max);let answers=new Set([target]);while(answers.size<3)answers.add(rand(0,max));choices=[...answers].map(v=>expression(v,max));for(let i=choices.length-1;i>0;i--){let j=rand(0,i);[choices[i],choices[j]]=[choices[j],choices[i]];}progress=0;drawChoices();update();}
function drawChoices(){q('.blocks').replaceChildren();choices.forEach((c,i)=>{let b=document.createElement('button');b.className='falling cursor-interaction';b.dataset.lane=i;b.style.left=(i*33.333)+'%';b.setAttribute('aria-label',`ช่อง ${i+1}: ${c.a} ${c.op==='+'?'บวก':'ลบ'} ${c.b}`);b.append(document.createTextNode(`${c.a} ${c.op} ${c.b}`));let label=document.createElement('small');label.textContent='ช่อง '+(i+1);b.append(label);b.onclick=()=>choose(i);q('.blocks').append(b);});position();}
function position(){let y=progress*Math.max(0,q('.field').clientHeight-78);q('.blocks').querySelectorAll('button').forEach(b=>b.style.transform=`translateY(${y}px)`);}
function update(){q('[data-target]').textContent=target;q('[data-score]').textContent=score;q('[data-round]').textContent=round+' / 10';q('[data-lives]').textContent=lives;root.querySelectorAll('[data-level]').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===level)));}
function save(){try{window.openai?.setWidgetState?.({modelContent:{game:'บล็อกตกบวกลบ',level:['เริ่มต้น','ปานกลาง','ยาก'][level],score,completed:round},privateContent:{v:1,origin:sessionOrigin,level,target,score,round,lives,choices,progress,running}})?.catch(()=>{});}catch(e){}}
function overlay(title,sub,button){q('[data-title]').textContent=title;q('[data-sub]').textContent=sub;q('[data-start]').textContent=button;q('.overlay').hidden=false;}
function finish(won){running=false;paused=false;q('[data-pause]').disabled=true;overlay(won?'เยี่ยมมาก! ผ่านครบ 10 ข้อ':'หมดโอกาสแล้ว ลองใหม่ได้',`ได้ ${score} คะแนน · ตอบถูก ${round} ข้อ`, 'เล่นใหม่');save();}
function choose(i){if(!running||paused||!choices[i])return;const c=choices[i];if(c.value===target){score+=100*(level+1);round++;q('.message').textContent=`ถูกต้อง! ${c.a} ${c.op} ${c.b} = ${target}`;if(round===10){update();finish(true);return;}}else{lives--;q('.message').textContent=`${c.a} ${c.op} ${c.b} = ${c.value} ยังไม่ตรงกับ ${target}`;if(!lives){update();finish(false);return;}}makeRound();save();}
function start(){if(running&&paused){paused=false;}else{score=0;round=0;lives=3;running=true;paused=false;makeRound();q('.message').textContent='เลือกเพียงหนึ่งบล็อกที่ได้คำตอบตรงกับเป้าหมาย';}q('.overlay').hidden=true;q('[data-pause]').disabled=false;last=performance.now();save();}
function pause(){if(!running||paused)return;paused=true;q('[data-pause]').disabled=true;overlay('พักเกม','บล็อกจะหยุดรอจนกว่าคุณจะเล่นต่อ','เล่นต่อ');save();}
q('[data-start]').onclick=start;q('[data-pause]').onclick=pause;
root.querySelectorAll('[data-level]').forEach((b,i)=>b.onclick=()=>{if(level===i)return;level=i;running=false;paused=false;score=0;round=0;lives=3;q('[data-pause]').disabled=true;makeRound();overlay('ระดับ'+b.textContent,`บวกลบจำนวน 0–${settings[i].max} · ${settings[i].seconds} วินาทีต่อข้อ`,'เริ่มเกม');q('.message').textContent='เปลี่ยนระดับแล้ว กดเริ่มเกมเพื่อเริ่มรอบใหม่';save();});
root.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)&&running&&!paused){e.preventDefault();choose(Number(e.key)-1);}if(e.key==='Escape')pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
function restore(s){if(s?.v!==1||![0,1,2].includes(s.level)||!Array.isArray(s.choices)||s.choices.length!==3||!s.choices.every(c=>Number.isInteger(c.a)&&Number.isInteger(c.b)&&c.a>=0&&c.b>=0&&['+','−'].includes(c.op)&&c.value===(c.op==='+'?c.a+c.b:c.a-c.b))||!s.choices.some(c=>c.value===s.target)||!Number.isInteger(s.round)||s.round<0||s.round>10||!Number.isInteger(s.lives)||s.lives<0||s.lives>3)return false;level=s.level;target=s.target;score=Number(s.score)||0;round=s.round;lives=s.lives;choices=s.choices;progress=Math.min(.99,Math.max(0,Number(s.progress)||0));running=!!s.running&&lives>0&&round<10;paused=running;drawChoices();update();if(running)overlay('กลับมาเล่นต่อ','เกมของคุณหยุดรออยู่','เล่นต่อ');else overlay('พร้อมเล่นรอบใหม่ไหม?',`คะแนนครั้งล่าสุด ${score}`,'เริ่มเกม');q('[data-pause]').disabled=true;return true;}
window.openai={widgetState:null,setWidgetState:async function(s){this.widgetState=s;try{localStorage.setItem("math-drop-state-p2",JSON.stringify(s))}catch(e){}}};try{window.openai.widgetState=JSON.parse(localStorage.getItem("math-drop-state-p2"))}catch(e){}
if(!restore(window.openai?.widgetState?.privateContent))makeRound();window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&s.origin!==sessionOrigin)restore(s);});
function frame(now){if(!root.isConnected)return;if(running&&!paused){progress+=Math.min(now-last,100)/(settings[level].seconds*1000);position();if(progress>=1){lives--;let c=choices.find(c=>c.value===target);q('.message').textContent=`หมดเวลา! คำตอบคือ ${c.a} ${c.op} ${c.b} = ${target}`;if(!lives){update();finish(false);}else{makeRound();save();}}}last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
</script>
</body>
</html>
