<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตัวอย่างเกมสไตล์ AR (ไม่ใช้กล้อง)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ font-family:"Sarabun","TH Sarabun New",system-ui,sans-serif; font-size:24px; } /* ป.1-3: ใหญ่กว่าปกติ 1.5 เท่า */
  html,body{ margin:0; padding:0; background:#F7F8FC; color:#1F2430; }
  header{
    background:linear-gradient(135deg,#8B5CF6,#EC4899);
    color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{ margin:0; font-size:1.05rem; }
  header a{ color:#fff; background:rgba(255,255,255,.22); padding:7px 14px; border-radius:999px; font-size:.82rem; text-decoration:none; }
  p.desc{ max-width:640px; margin:14px auto 0; padding:0 20px; font-size:.9rem; color:#555; text-align:center; }

  #scene{
    position:relative;
    max-width:900px; margin:20px auto; height:60vh; min-height:340px;
    border-radius:20px; overflow:hidden;
    background:linear-gradient(to bottom, #BFE3FF 0%, #E9F7FF 55%, #CDEFC9 56%, #A9E2A0 100%);
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    touch-action:none;
    border:1px solid #dfe4ee;
  }
  #scene::after{ /* cloud decorations */
    content:"☁️  ☁️      ☁️";
    position:absolute; top:20px; left:0; right:0; text-align:center; font-size:1.6rem; opacity:.85; pointer-events:none;
  }
  .placed{
    position:absolute; font-size:3rem; user-select:none; cursor:grab;
    transform:translate(-50%,-100%);
    filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));
    animation:pop .35s ease;
  }
  .placed::after{
    content:""; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    width:34px; height:10px; background:rgba(0,0,0,.18); border-radius:50%; z-index:-1;
  }
  @keyframes pop{ from{ transform:translate(-50%,-100%) scale(0.2); opacity:0 } to{ transform:translate(-50%,-100%) scale(1); opacity:1 } }

  #tray{
    max-width:900px; margin:0 auto 30px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; padding:0 20px;
  }
  .sticker{
    font-size:2.3rem; background:#fff; border:1px solid #E6E8F0; border-radius:16px;
    width:64px; height:64px; display:flex; align-items:center; justify-content:center;
    cursor:grab; box-shadow:0 4px 10px rgba(0,0,0,.08); touch-action:none;
  }
  .hint{ text-align:center; color:#888; font-size:.82rem; margin-top:-14px; margin-bottom:18px; }
  #clear{
    display:block; margin:0 auto 40px; padding:9px 20px; border:none; border-radius:999px;
    background:#EEF1FB; color:#3B82F6; font-weight:600; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>🎮 ตัวอย่างที่ 2: เกมสไตล์ AR (ไม่ใช้กล้อง)</h1>
  <a href="../index.html#/">← กลับหน้าเว็บ</a>
</header>

<p class="desc">ลากตัวการ์ตูนจากถาดด้านล่างไปวางบนฉากได้เลย — ไม่ต้องขอสิทธิ์กล้อง ทำงานได้ทันทีทุกอุปกรณ์
เหมาะเป็น "เกมทบทวนเนื้อหา" ที่ให้ความรู้สึกสนุกแบบ AR แต่เข้าถึงง่ายกว่า</p>

<div id="scene"></div>
<p class="hint">👆 ลาก/แตะสติกเกอร์ไปวางบนฉากด้านบน</p>

<div id="tray">
  <div class="sticker" data-emoji="🤖">🤖</div>
  <div class="sticker" data-emoji="💻">💻</div>
  <div class="sticker" data-emoji="💡">💡</div>
  <div class="sticker" data-emoji="⚙️">⚙️</div>
  <div class="sticker" data-emoji="🧩">🧩</div>
  <div class="sticker" data-emoji="🚀">🚀</div>
</div>

<button id="clear">🗑️ ล้างฉาก</button>

<script>
const scene = document.getElementById("scene");

function placeSticker(emoji, x, y){
  const el = document.createElement("div");
  el.className = "placed";
  el.textContent = emoji;
  el.style.left = x + "px";
  el.style.top = y + "px";
  scene.appendChild(el);
  makeMovable(el);
}

function makeMovable(el){
  el.addEventListener("pointerdown", (e) => {
    el.setPointerCapture(e.pointerId);
    el.style.cursor = "grabbing";
    const onMove = (ev) => {
      const rect = scene.getBoundingClientRect();
      el.style.left = (ev.clientX - rect.left) + "px";
      el.style.top = (ev.clientY - rect.top) + "px";
    };
    const onUp = () => {
      el.style.cursor = "grab";
      el.removeEventListener("pointermove", onMove);
      el.removeEventListener("pointerup", onUp);
    };
    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
  });
}

// --- ลากจากถาด: ใช้ Pointer Events รองรับทั้งเมาส์/นิ้ว/ปากกาในตัวเดียว ---
document.querySelectorAll(".sticker").forEach(s => {
  s.addEventListener("pointerdown", (e) => {
    const emoji = s.dataset.emoji;
    const ghost = document.createElement("div");
    ghost.textContent = emoji;
    ghost.style.position = "fixed";
    ghost.style.fontSize = "2.3rem";
    ghost.style.pointerEvents = "none";
    ghost.style.zIndex = 999;
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";
    ghost.style.transform = "translate(-50%,-50%)";
    document.body.appendChild(ghost);

    const onMove = (ev) => {
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
    };
    const onUp = (ev) => {
      const rect = scene.getBoundingClientRect();
      if(ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom){
        placeSticker(emoji, ev.clientX - rect.left, ev.clientY - rect.top);
      }
      ghost.remove();
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
    };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  });
});

document.getElementById("clear").addEventListener("click", () => {
  scene.querySelectorAll(".placed").forEach(el => el.remove());
});
</script>
</body>
</html>
